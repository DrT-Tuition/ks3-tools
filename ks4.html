/* Apply a saved theme choice before the page paints (no flash). */
try { var t = localStorage.getItem("ks3tools-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* Dr T's Classroom palette, dyslexia-friendly: pale Tint page, Paper cards, Ink text. */
:root{
  --bg:#E9EDF3; --surface:#FBFAF8; --ink:#1E252E; --muted:#5A6472; --line:#D5DCE5;
  --accent:#14243D; --gold:#D9A536; --focus:#14243D; --shadow:0 2px 8px rgba(20,36,61,.08); --brand-name:#14243D;
  --f-body:"Atkinson Hyperlegible", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14243D; --surface:#1E3555; --ink:#E9EDF3; --muted:#A9B4C4; --line:#2E4A70;
  --accent:#D9A536; --focus:#D9A536; --shadow:none; --brand-name:#E9EDF3; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#14243D; --surface:#1E3555; --ink:#E9EDF3; --muted:#A9B4C4; --line:#2E4A70;
  --accent:#D9A536; --focus:#D9A536; --shadow:none; --brand-name:#E9EDF3; color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 var(--f-body);letter-spacing:.01em;word-spacing:.06em}
.wrap{max-width:960px;margin:0 auto;padding:32px 16px 40px}
h1{font-weight:700;font-size:clamp(30px,5vw,44px);line-height:1.15;margin:0 0 8px;color:var(--accent)}
.top{display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:flex-start;gap:12px}
.theme-btn{font:700 15px var(--f-body);padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.theme-btn:hover{border-color:var(--accent)}
.lead{color:var(--muted);margin:0 0 8px;max-width:60ch}
h2{font-size:20px;margin:32px 0 12px;color:var(--accent)}
.rule{width:56px;height:3px;background:var(--gold);margin:16px 0 8px;border:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
a.tool{display:grid;gap:6px;padding:18px 20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  border-left:5px solid var(--accent);border-radius:10px;color:inherit;text-decoration:none}
a.tool:hover{border-color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.name{font-weight:700;font-size:21px;color:var(--accent)}
.desc{color:var(--ink);font-size:16px}
.tag{font-size:15px;color:var(--muted)}
/* brand mark, top right: official shield with the name beneath */
.brandmark{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;flex:none;padding:2px 4px}
.brandmark svg{height:52px;width:auto;display:block}
.brandmark span{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:15px;line-height:1.1;color:var(--brand-name);white-space:nowrap;letter-spacing:0}
.brandmark .mk-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brandmark .mk-light{display:none}:root:not([data-theme="light"]) .brandmark .mk-dark{display:block}}
:root[data-theme="dark"] .brandmark .mk-light{display:none}
:root[data-theme="dark"] .brandmark .mk-dark{display:block}
/* footer: small shield + licence line */
footer.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:8px;color:var(--muted);font-size:14px}
footer.brand svg{height:28px;width:auto;display:block;flex:none}
footer.brand .mk-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) footer.brand .mk-light{display:none}:root:not([data-theme="light"]) footer.brand .mk-dark{display:block}}
:root[data-theme="dark"] footer.brand .mk-light{display:none}
:root[data-theme="dark"] footer.brand .mk-dark{display:block}
footer.brand a{color:inherit}
footer.brand{margin-top:40px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}

/* menu pages */
.crumbs{font-size:15px;color:var(--muted);margin:0 0 6px}
.crumbs a{color:inherit}
.crumbs span[aria-current]{color:var(--ink);font-weight:700}
.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:20px}
.big{display:grid;align-content:start;gap:8px;padding:22px 22px 20px;background:var(--surface);border:1px solid var(--line);
  border-top:6px solid var(--card,var(--accent));border-radius:12px;box-shadow:var(--shadow);color:inherit;text-decoration:none}
a.big:hover{border-color:var(--card,var(--accent))}
.big .t{font-weight:700;font-size:30px;line-height:1.1;color:var(--accent)}
.big .y{font-weight:700;font-size:16px;color:var(--muted)}
.big .d{font-size:16px}
.big .n{font-size:15px;color:var(--muted)}
.big .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.big .chips a,.big .chips span{font-size:15px;font-weight:700;padding:4px 12px;border-radius:999px;border:1px solid var(--line);
  color:var(--accent);text-decoration:none;background:var(--bg)}
.big .chips a:hover{border-color:var(--accent)}
.big .chips span{color:var(--muted);font-weight:400}
.soon{opacity:.8}
.subjects{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px}
a.tool{align-content:start}
h2.topic{font-size:22px;margin:36px 0 14px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.subjects + h2.topic{margin-top:28px}
.subjects a{font-weight:700;font-size:16px;padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  color:var(--accent);text-decoration:none}
.subjects a:hover{border-color:var(--accent)}
.subjects a[aria-current=page]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.empty a{color:var(--accent);font-weight:700}
.empty{padding:22px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;color:var(--muted);margin-top:8px}
:root{--bio:#2E7D4F;--chem:#8A3FA0;--phys:#1F6FB2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bio:#6CC48E;--chem:#C99BE0;--phys:#7DB5E8}}
:root[data-theme="dark"]{--bio:#6CC48E;--chem:#C99BE0;--phys:#7DB5E8}
.s-biology{--card:var(--bio)} .s-chemistry{--card:var(--chem)} .s-physics{--card:var(--phys)}
a.tool.s-biology,a.tool.s-chemistry,a.tool.s-physics{border-left-color:var(--card)}
</style>
</head>
